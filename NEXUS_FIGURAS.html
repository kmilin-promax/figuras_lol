<style>
:root{--bg:#0A1428;--bg2:#0f1c36;--gold:#C8AA6E;--teal:#0AC8B9;--bone:#F0E6D2;--ac:#0AC8B9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(10,20,40,.88);backdrop-filter:blur(10px);border-bottom:1px solid #c8aa6e44;padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;align-items:center;gap:12px;height:62px}

.logo i{width:22px;height:22px;background:var(--teal);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
nav{display:flex;gap:16px;margin-left:auto;font-size:14px}nav a{opacity:.8;transition:opacity .2s}nav a:hover{opacity:1;color:var(--gold)}
.hd input,.hd select{background:#0f1c36;border:1px solid #c8aa6e55;color:var(--bone);border-radius:4px;padding:6px 8px;width:110px}

/* hero */
#inicio{padding:0;min-height:100svh;display:flex;align-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 70% 40%,color-mix(in srgb,var(--ac) 25%,transparent),transparent 55%),var(--bg)}

.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}.dots button{width:10px;height:10px;border-radius:50%;border:1px solid var(--gold);background:none;padding:0;transition:transform .3s,background .3s}.dots .on{background:var(--gold);transform:scale(1.4)}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
/* reveal */
.rv{opacity:0;transform:translateY(30px);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}

.fl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}.fl select{background:#0f1c36;color:var(--bone);border:1px solid var(--gold);padding:8px;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}

.pg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px}@media(max-width:760px){.pg{grid-template-columns:1fr}}

.dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);border-left:1px solid var(--gold);z-index:90;transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);padding:18px;overflow:auto}.dr.on{transform:none}

form{display:grid;gap:10px;max-width:520px;margin:auto}input,select,textarea{background:#0f1c36;border:1px solid #c8aa6e55;color:var(--bone);border-radius:4px;padding:10px;font:inherit;width:100%}
.hp{position:absolute;left:-9999px}
.rvw{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:28px}.rvw div{background:var(--bg2);padding:16px;border-radius:10px;border:1px solid #c8aa6e33}
.soc{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.soc a{border:1px solid var(--gold);padding:10px 18px;border-radius:30px;transition:transform .25s,background .25s}.soc a:hover{background:var(--gold);color:#000;transform:translateY(-3px)}
.loc{display:grid;grid-template-columns:1fr 1.4fr;gap:24px}@media(max-width:760px){.loc{grid-template-columns:1fr}}iframe{width:100%;height:320px;border:0;border-radius:10px}

#ch{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));background:var(--bg2);border:1px solid var(--teal);border-radius:12px;z-index:70;transform:translateY(20px) scale(.95);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s;display:flex;flex-direction:column}

#cm p{margin:0;padding:6px 10px;border-radius:8px;background:#ffffff14;max-width:85%}#cm p.u{align-self:flex-end;background:var(--teal);color:#000}
.pm{display:none;gap:8px;flex-direction:column;margin-top:10px}.pm.on{display:flex}.pm code{background:#0f1c36;padding:6px;border-radius:4px;word-break:break-all;font-size:12px}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}.rv{opacity:1;transform:none}}
.fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}.fig .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 8px;background:linear-gradient(transparent,#0A1428ee);border-radius:0 0 14px 14px;font-size:16px}.fig{overflow:hidden}.sl .fig{width:100%;aspect-ratio:16/10}.card .fig{aspect-ratio:4/5}.rot .fig{aspect-ratio:4/5}

/* ===== Botones estilo GSAP: pill, sin bordes, relleno líquido suave ===== */
:root{--ease:cubic-bezier(.65,0,.35,1)}
.btn,.cartb,.tabs button,.soc a,.q button,.dots button,#cf{border:0!important;border-radius:999px;position:relative;overflow:hidden;isolation:isolate;font-weight:600;letter-spacing:.01em;transition:transform .5s var(--ease),color .45s var(--ease),background-color .45s var(--ease);will-change:transform;-webkit-tap-highlight-color:transparent}
.btn{background:var(--gold);color:#0A1428;padding:12px 24px}
.btn.t{background:var(--teal)}
.btn.o,.cartb,.tabs button,.soc a,.q button{background:rgba(240,230,210,.09);color:var(--bone)}

.btn.o::before,.cartb::before,.tabs button::before,.soc a::before,.q button::before{background:var(--gold)}
.btn:hover::before,.cartb:hover::before,.tabs button:hover::before,.soc a:hover::before,.q button:hover::before,.btn:focus-visible::before{transform:translate3d(0,-50%,0)}
.btn:hover,.btn.o:hover,.cartb:hover,.tabs button:hover,.soc a:hover,.q button:hover{color:#0A1428;transform:none}
.btn:active,.cartb:active,.tabs button:active,.soc a:active,.q button:active,#cf:active{transform:scale(.95);transition-duration:.15s}
.btn.t:hover{color:#0A1428}
.tabs button.on{background:var(--ac);color:#0A1428}.tabs button.on:hover::before{background:var(--bone)}
.dots button{background:rgba(240,230,210,.3);width:10px;height:10px}.dots button.on{background:var(--gold);transform:scale(1.5)}.dots button:hover{background:var(--bone)}
#cf{transition:transform .5s var(--ease),box-shadow .5s}#cf:hover{transform:scale(1.1) rotate(-6deg);box-shadow:0 0 34px #0ac8b9aa}
.x,#mb{transition:transform .5s var(--ease),opacity .3s;opacity:.8}.x:hover,#mb:hover{transform:rotate(90deg);opacity:1}
.soc a{background:rgba(240,230,210,.09)}.soc a:hover{transform:none}
input,select,textarea{border:0!important;background:rgba(240,230,210,.08)!important;border-radius:999px;transition:background-color .35s var(--ease),box-shadow .35s var(--ease)}
textarea{border-radius:18px}input:focus,select:focus,textarea:focus{background:rgba(240,230,210,.14)!important;box-shadow:0 0 0 2px var(--ac)!important;outline:0}

.card .btn,.card .btn.o{padding:9px 16px;font-size:14px}
@media(prefers-reduced-motion:reduce){.btn::before,.cartb::before,.tabs button::before,.soc a::before,.q button::before{transition-duration:.01ms}}

/* ===== ORYZO: cuarto oscuro editorial ===== */
:root{--bg:#100904;--bg2:#100904;--gold:#ffedd7;--teal:#ffedd7;--bone:#ffedd7;--bark:#382416;--cork:#40372e;--drift:#6c5f51;--ember:#dc5000;--ease:cubic-bezier(.65,0,.35,1)}
body{font:500 13px/1.3 Inter,system-ui,sans-serif;font-feature-settings:"ss01" on;text-transform:uppercase;letter-spacing:0;background:#100904;color:#ffedd7}

/* giro: mantener presionado. Izquierda → gira a la derecha · Derecha → gira a la izquierda */
function spin(stage,getF,onHold){
 let cur=0,hold=false,t0=0,raf=0,dir=1;
 const put=v=>{cur=v;const f=getF();if(f)f.style.transform=`rotateX(-10deg) rotateY(${v}deg)`};
 const tick=n=>{if(!hold)return;put(cur+dir*(n-t0)*.22);t0=n;raf=requestAnimationFrame(tick)};
 const back=()=>{const from=((cur%360)+360)%360,to=from>180?360:0,t1=performance.now();
  const st=n=>{const k=Math.min((n-t1)/700,1),e=1-Math.pow(1-k,3);put(from+(to-from)*e);if(k<1&&!hold)raf=requestAnimationFrame(st);else if(!hold){const f=getF();if(f)f.style.transform="";cur=0}};raf=requestAnimationFrame(st)};
 stage.addEventListener("pointerdown",e=>{if(e.button>0||!e.target.closest(".stage"))return;const f=getF();if(!f)return;
  const r=f.parentElement.getBoundingClientRect();dir=e.clientX<r.left+r.width/2?1:-1;
  hold=true;cancelAnimationFrame(raf);t0=performance.now();try{stage.setPointerCapture(e.pointerId)}catch(_){}onHold&&onHold(true);raf=requestAnimationFrame(tick)});
 const up=()=>{if(!hold)return;hold=false;cancelAnimationFrame(raf);onHold&&onHold(false);back()};
 stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);stage.addEventListener("lostpointercapture",up);
 stage.addEventListener("contextmenu",e=>e.preventDefault());
}

const FinalShader={uniforms:{iTime:{value:0},tDiffuse:{value:null},torusTexture:{value:null},bloomTexture:{value:null},haloTexture:{value:null},

uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;

const count=4200,depth=30;
const positions=new Float32Array(count*3),palette=new Float32Array(count),bright=new Float32Array(count),scales=new Float32Array(count),phases=new Float32Array(count);
for(let i=0;i<count;i++){const i3=i*3;
 positions[i3]=(Math.random()-0.5)*24;positions[i3+1]=(Math.random()-0.5)*16;positions[i3+2]=(Math.random()-0.5)*30;
 palette[i]=Math.floor(Math.random()*3);bright[i]=0.7+Math.random()*0.6;scales[i]=0.5+Math.pow(Math.random(),1.4)*2.5;phases[i]=Math.random()}

geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('aScale',new THREE.Float32BufferAttribute(scales,1));
geo.setAttribute('aPhase',new THREE.Float32BufferAttribute(phases,1));geo.setAttribute('aPalette',new THREE.Float32BufferAttribute(palette,1));geo.setAttribute('aBright',new THREE.Float32BufferAttribute(bright,1));
const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 uniforms:{uTime:{value:0},uSize:{value:50},uOpacity:{value:0},uDrift:{value:0},uDepth:{value:30},uTwinkle:{value:1},uCursor:{value:new THREE.Vector3()},uRepelRadius:{value:5},uRepelStrength:{value:0.35},uActivity:{value:0},
 uColorA:{value:hexToVec3('#aef6cf')},uColorB:{value:hexToVec3('#5fe6a0')},uColorC:{value:hexToVec3('#eafff2')},uBrightness:{value:1.85}},
vertexShader:`uniform float uTime; uniform float uSize; uniform float uDrift; uniform float uDepth; uniform float uTwinkle;
uniform vec3 uCursor; uniform float uRepelRadius; uniform float uRepelStrength; uniform float uActivity;
uniform vec3 uColorA; uniform vec3 uColorB; uniform vec3 uColorC;
attribute float aScale; attribute float aPhase; attribute float aPalette; attribute float aBright;
varying vec3 vColor; varying float vTwinkle;
void main() {
  vec3 pos = position;
  pos.z = mod(pos.z + uDrift + (uDepth * 0.5), uDepth) - (uDepth * 0.5);
  float tw = sin(uTime * 1.6 + aPhase * 6.2831);

  vColor = base * aBright;
}`,
fragmentShader:`uniform float uOpacity; uniform float uBrightness;
varying vec3 vColor; varying float vTwinkle;
void main() {
  vec2 uv = gl_PointCoord - 0.5;
  float d = length(uv);
  if (d > 0.5) discard;
  float strength = pow(1.0 - d * 2.0, 4.0);

const points=new THREE.Points(geo,mat);points.layers.enable(LAYERS.ENTIRE_SCENE);
const group=new THREE.Group();group.add(points);scene.add(group);
const POINTER={ndc:new THREE.Vector2(),world:new THREE.Vector3(),activity:0,active:false,lastMove:0};
addEventListener('mousemove',e=>{POINTER.ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1));POINTER.active=true;POINTER.lastMove=performance.now()});

 if(POINTER.active){const v=new THREE.Vector3(POINTER.ndc.x,POINTER.ndc.y,0.5).unproject(camera);const dir=v.sub(camera.position).normalize();
  if(Math.abs(dir.z)>1e-4){const t=-camera.position.z/dir.z;if(t>0&&isFinite(t))target=camera.position.clone().add(dir.multiplyScalar(t))}}
 POINTER.world.lerp(target,0.12);
 const idle=(performance.now()-POINTER.lastMove)/1000,want=(POINTER.active&&idle<3)?1:0;
 POINTER.activity+=(want-POINTER.activity)*0.06;
 mat.uniforms.uCursor.value.copy(POINTER.world);mat.uniforms.uActivity.value=POINTER.activity}
let scrollTarget=0,scrollSmooth=0,scrollCurrent=0;const mouseNdc={x:0,y:0},mouseSmooth={x:0,y:0};

addEventListener('pointermove',e=>{mouseNdc.x=e.clientX/innerWidth*2-1;mouseNdc.y=-(e.clientY/innerHeight*2-1)},{passive:true});
const appearStart=performance.now();let t0=performance.now()/1000;

 const now=performance.now(),t=now/1000;finalPass.uniforms.iTime.value=t;
 scrollSmooth=lerp(scrollSmooth,scrollTarget,0.10);scrollCurrent=lerp(scrollCurrent,scrollSmooth,0.06);
 mouseSmooth.x=lerp(mouseSmooth.x,mouseNdc.x,0.06);mouseSmooth.y=lerp(mouseSmooth.y,mouseNdc.y,0.06);

 const scroll=scrollCurrent,m=mouseSmooth,dt=Math.min(0.05,t-t0);t0=t;

 const fade=clamp((now-appearStart-300)/1400,0,1);mat.uniforms.uOpacity.value=fade*2;
